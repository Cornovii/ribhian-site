Note: Contact page. Contains contact form and studio information.-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Contact Us — Ribhian Games LLC</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>

    .contact-hero {
      padding: 5rem 3rem 4rem;
      text-align: center;
      background: linear-gradient(180deg, var(--black) 0%, var(--deep) 100%);
      position: relative;
      overflow: hidden;
    }

    .contact-hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 60% at 50% 40%, rgba(140,31,31,0.12) 0%, transparent 70%);
      pointer-events: none;
    }

    .contact-hero-content { position: relative; z-index: 2; }

    .contact-section {
      padding: 5rem 3rem;
      background: var(--deep);
      border-top: 1px solid rgba(201,151,58,0.1);
    }

    .contact-inner {
      max-width: 760px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 4rem;
      align-items: start;
    }

    @media (max-width: 600px) {
      .contact-inner { grid-template-columns: 1fr; gap: 2.5rem; }
      .contact-hero { padding: 3.5rem 1.4rem 3rem; }
      .contact-section { padding: 3rem 1.4rem; }
    }

    /* ── ADDRESS BLOCK ── */
    .contact-block-label {
      font-family: 'Cinzel', serif;
      font-size: 0.62rem;
      letter-spacing: 0.4em;
      text-transform: uppercase;
      color: var(--crimson-mid);
      margin-bottom: 1.2rem;
    }

    .contact-name {
      font-family: 'Cinzel', serif;
      font-size: 1.05rem;
      font-weight: 700;
      color: var(--parchment);
      margin-bottom: 0.8rem;
    }

    .contact-address {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.08rem;
      font-weight: 500;
      color: var(--text-body);
      line-height: 1.9;
    }

    /* ── CONTACT LINKS ── */
    .contact-links {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .contact-link {
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 1rem 1.2rem;
      background: var(--stone);
      border: 1px solid rgba(201,151,58,0.12);
      border-left: 3px solid var(--gold);
      transition: background 0.2s, border-color 0.2s;
      text-decoration: none;
    }

    .contact-link:hover {
      background: var(--stone-mid);
      border-left-color: var(--gold-bright);
    }

    .contact-link--facebook {
      border-left-color: #4267B2;
    }

    .contact-link--facebook:hover {
      border-left-color: #5b7fd4;
    }

    .contact-link-icon {
      font-size: 1.4rem;
      flex-shrink: 0;
    }

    .contact-link-text {
      display: flex;
      flex-direction: column;
      gap: 0.1rem;
    }

    .contact-link-label {
      font-family: 'Cinzel', serif;
      font-size: 0.6rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--text-dim);
    }

    .contact-link-value {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.05rem;
      font-weight: 600;
      color: var(--ash);
    }

    .contact-link:hover .contact-link-value {
      color: var(--gold-bright);
    }

  </style>
</head>
<body>

  <div id="topbar-mount"></div>

  <div class="site-wrapper">
    <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
    <div class="sidebar" id="sidebar-mount"></div>

    <main class="main-content">

      <!-- HERO -->
      <section class="contact-hero">
        <div class="contact-hero-content">
          <span class="section-label">Get in Touch</span>
          <h1 class="section-heading" style="margin-top:0.5rem;">Contact Us</h1>
          <div class="divider" style="max-width:300px;margin:1.5rem auto 0;">
            <div class="divider-line"></div>
            <div class="divider-gem"></div>
            <div class="divider-line"></div>
          </div>
        </div>
      </section>

      <!-- CONTACT DETAILS -->
      <section class="contact-section">
        <div class="contact-inner">

          <!-- Address -->
          <div>
            <p class="contact-block-label">Our Location</p>
            <p class="contact-name">Ribhian Games LLC</p>
            <p class="contact-address">
              70 Boardman Rd.<br />
              Unit C-8<br />
              Bristol, CT 06010<br />
              USA
            </p>
          </div>

          <!-- Links -->
          <div>
            <p class="contact-block-label">Reach Us</p>
            <div class="contact-links">

              <a href="mailto:ribhiangames@gmail.com" class="contact-link">
                <span class="contact-link-icon">✉</span>
                <div class="contact-link-text">
                  <span class="contact-link-label">Email</span>
                  <span class="contact-link-value">ribhiangames@gmail.com</span>
                </div>
              </a>

              <a href="https://www.facebook.com/profile.php?id=61574660391909" target="_blank" rel="noopener" class="contact-link contact-link--facebook">
                <span class="contact-link-icon">📘</span>
                <div class="contact-link-text">
                  <span class="contact-link-label">Facebook</span>
                  <span class="contact-link-value">Ribhian Games LLC</span>
                </div>
              </a>

            </div>
          </div>

        </div>
      </section>

      <footer class="site-footer">
        <p class="footer-text">&copy; 2025 <strong>Ribhian Games LLC</strong> &nbsp;·&nbsp; All Rights Reserved</p>
      </footer>

    </main>
  </div>

  <script src="js/site.js"></script>
</body>
</html>
