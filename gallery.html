<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery — Ribhian Games</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #080604;
      color: #c8b070;
      font-family: 'Georgia', serif;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    .gallery-header {
      padding: 3.5rem 3rem 2rem;
      border-bottom: 1px solid rgba(201,151,58,0.12);
      background: #0a0806;
    }
    .gallery-eyebrow {
      font-family: 'Georgia', serif;
      font-size: 0.6rem;
      letter-spacing: 0.5em;
      text-transform: uppercase;
      color: #c9973a;
      text-shadow: 0 0 8px rgba(201,151,58,0.6);
      display: block;
      margin-bottom: 0.5rem;
    }
    .gallery-title {
      font-family: 'Georgia', serif;
      font-size: clamp(1.8rem, 4vw, 3rem);
      font-weight: 700;
      color: #e8d8b0;
      letter-spacing: 0.04em;
      text-shadow: 0 2px 4px rgba(0,0,0,0.9);
    }
    .gallery-count {
      font-size: 0.8rem;
      color: #706050;
      margin-top: 0.4rem;
      font-style: italic;
    }

    /* ── GRID ── */
    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 4px;
      padding: 4px;
      background: #040302;
    }

    .gallery-item {
      position: relative;
      height: 520px;
      overflow: hidden;
      cursor: pointer;
      background: #141008;
    }

    .gallery-item img {
      width: 100%; height: 100%;
      object-fit: cover;
      display: block;
      transition: transform 0.35s ease, filter 0.35s ease;
      filter: brightness(0.92);
    }

    .gallery-item:hover img {
      transform: scale(1.04);
      filter: brightness(1.05);
    }

    .gallery-item::after {
      content: '';
      position: absolute; inset: 0;
      background: linear-gradient(to bottom, transparent 60%, rgba(4,3,2,0.45) 100%);
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.3s;
    }
    .gallery-item:hover::after { opacity: 1; }

    /* ── LIGHTBOX ── */
    .lightbox {
      display: none;
      position: fixed; inset: 0;
      z-index: 9999;
      background: rgba(4,3,2,0.96);
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .lightbox.active { display: flex; }

    .lightbox-img {
      max-width: 92vw;
      max-height: 92vh;
      object-fit: contain;
      box-shadow: 0 0 60px rgba(0,0,0,0.9), 0 0 0 1px rgba(201,151,58,0.15);
      display: block;
    }

    .lightbox-close {
      position: fixed;
      top: 1.2rem; right: 1.5rem;
      font-size: 1.8rem;
      color: #c9973a;
      cursor: pointer;
      line-height: 1;
      opacity: 0.7;
      transition: opacity 0.2s;
      background: none; border: none;
      font-family: Georgia, serif;
    }
    .lightbox-close:hover { opacity: 1; }

    .lightbox-nav {
      position: fixed;
      top: 50%; transform: translateY(-50%);
      font-size: 2rem; color: #c9973a;
      cursor: pointer; opacity: 0.5;
      transition: opacity 0.2s;
      background: none; border: none;
      padding: 1rem;
      font-family: Georgia, serif;
    }
    .lightbox-nav:hover { opacity: 1; }
    .lightbox-prev { left: 0.5rem; }
    .lightbox-next { right: 0.5rem; }

    .lightbox-counter {
      position: fixed;
      bottom: 1.2rem; left: 50%; transform: translateX(-50%);
      font-size: 0.65rem; letter-spacing: 0.3em;
      color: #706050; font-family: Georgia, serif;
      text-transform: uppercase;
    }

    @media (max-width: 700px) {
      .gallery-grid { grid-template-columns: repeat(2, 1fr); }
      .gallery-header { padding: 2rem 1.5rem 1.5rem; }
    }
    @media (max-width: 420px) {
      .gallery-grid { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

<div id="topbar-mount"></div>
<div class="site-wrapper">
  <div class="sidebar-overlay" id="sidebar-overlay" onclick="closeSidebar()"></div>
  <div class="sidebar" id="sidebar-mount"></div>

  <main class="main-content">

    <div class="gallery-header">
      <span class="gallery-eyebrow">Ribhian Games LLC</span>
      <h1 class="gallery-title">Gallery</h1>
      <p class="gallery-count">78 works</p>
    </div>

    <div class="gallery-grid" id="gallery-grid"></div>

    <!-- LIGHTBOX -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox(event)">
      <button class="lightbox-close" onclick="closeLightboxBtn()">&#215;</button>
      <button class="lightbox-nav lightbox-prev" onclick="navigateLight(-1, event)">&#8249;</button>
      <img class="lightbox-img" id="lightbox-img" src="" alt="" />
      <button class="lightbox-nav lightbox-next" onclick="navigateLight(1, event)">&#8250;</button>
      <div class="lightbox-counter" id="lightbox-counter"></div>
    </div>

  </main>
</div>

<script src="js/site.js"></script>
<script>
  const images = [
    "3-friends.jpg","abdul.jpg","Aldous.jpg","arathalian.jpg",
    "Astrid.jpg","blood-Lord.png","Book-Skin-1.jpg","brightstone.jpg",
    "Bull.jpg","buss.jpg","cairn.jpg","Caleb.jpg","ceres.png",
    "Cordilia.jpg","cornovii.jpg","corsair.jpg","Deck-of- Fortune.png",
    "dwarfcity.jpg","Eliza.jpg","Evangeline.jpg","falgrin.jpg",
    "gargoyle.jpg","Gaslit Summons Cover.jpg","Grimhild.jpg","Helena.jpg",
    "hodang.jpg","inthewoods.jpg","Kael.jpg","Koda.jpg","Marcus.jpg",
    "Marie.jpg","Maya portrait.jpg","monk.jpg","nathaniel.jpg",
    "necro.jpg","Necro_B&W.jpeg","Nelia.jpg","pair.jpg","pica.jpg",
    "quick.jpg","Radiant.jpg","Reginald.jpg","salamander.jpg",
    "shagal.jpg","Signal Dysphoria Cover.png","Signal Lost Cover.png",
    "Silas.jpg","Spiro.jpg","steve2.png","templars.jpg",
    "Tendrils on the Fog.jpeg","the babtism.jpg","the crossroad.jpg",
    "the kiln.jpg","The Shelter.jpg","TheBaptism.png","thebarrier.png",
    "thebeacon.png","TheBloodLord.jpg","theCrossRoads.png","TheDrifter.png",
    "TheKilln.png","themountain.png","theScout.png","thewildfire.png",
    "Thomas.jpg","Thornak.jpg","Tinker 1.jpg","tracker.jpg","Tzago.jpeg",
    "undead.jpg","vandeur.jpg","Viktor.jpg","WarriorWoman.jpg",
    "Whisper.jpg","witchdoctor.jpg","Wolf.jpg","Zara.jpg"
  ];

  let currentIndex = 0;

  // Build grid
  const grid = document.getElementById('gallery-grid');
  images.forEach((img, i) => {
    const item = document.createElement('div');
    item.className = 'gallery-item';
    item.innerHTML = `<img src="art/${encodeURIComponent(img)}" alt="" loading="lazy" />`;
    item.addEventListener('click', () => openLightbox(i));
    grid.appendChild(item);
  });

  function openLightbox(index) {
    currentIndex = index;
    const lb = document.getElementById('lightbox');
    const lbImg = document.getElementById('lightbox-img');
    lbImg.src = 'art/' + encodeURIComponent(images[currentIndex]);
    updateCounter();
    lb.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox(e) {
    if (e.target === document.getElementById('lightbox')) {
      closeLightboxBtn();
    }
  }

  function closeLightboxBtn() {
    document.getElementById('lightbox').classList.remove('active');
    document.body.style.overflow = '';
  }

  function navigateLight(dir, e) {
    e.stopPropagation();
    currentIndex = (currentIndex + dir + images.length) % images.length;
    document.getElementById('lightbox-img').src = 'art/' + encodeURIComponent(images[currentIndex]);
    updateCounter();
  }

  function updateCounter() {
    document.getElementById('lightbox-counter').textContent =
      (currentIndex + 1) + ' / ' + images.length;
  }

  document.addEventListener('keydown', e => {
    const lb = document.getElementById('lightbox');
    if (!lb.classList.contains('active')) return;
    if (e.key === 'Escape') closeLightboxBtn();
    if (e.key === 'ArrowLeft') navigateLight(-1, { stopPropagation: () => {} });
    if (e.key === 'ArrowRight') navigateLight(1, { stopPropagation: () => {} });
  });
</script>
</body>
</html>
